<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Primech AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f7f8fa;
            color: #222;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: white;
            border-bottom: 1px solid #e8e8e8;
            padding: 18px 20px;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* Bigger and more visible category dropdown */

        .category-wrapper {
            position: relative;
        }

        .category-select {
            appearance: none;
            -webkit-appearance: none;

            background: #222;
            color: white;

            border: none;
            border-radius: 10px;

            padding: 12px 42px 12px 16px;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;
            outline: none;

            min-width: 130px;
        }

        .category-wrapper::after {
            content: "⌄";
            position: absolute;
            right: 14px;
            top: 9px;
            color: white;
            font-size: 17px;
            pointer-events: none;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }


        /* =========================
           CATEGORY INDICATOR
        ========================= */

        .category-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
        }

        .selection-count {
            font-size: 13px;
            color: #888;
        }


        /* =========================
           ITEMS
        ========================= */

        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .item-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;

            padding: 16px 12px;

            text-align: center;
            cursor: pointer;

            transition: all 0.15s ease;

            position: relative;

            min-height: 130px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .item-card:active {
            transform: scale(0.97);
        }

        .item-card.selected {
            border: 2px solid #222;
            background: #fafafa;
        }

        .item-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 8px;
            background: white;
        }

        .item-name {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.35;
        }

        /* Sub-heading inside a category, e.g. Coffee Machine / Vending Machine */

        .group-title {
            grid-column: 1 / -1;
            font-size: 13px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 10px;
        }

        .group-title:first-child {
            margin-top: 0;
        }


        /* Checkbox */

        .checkbox {
            position: absolute;

            top: 10px;
            right: 10px;

            width: 20px;
            height: 20px;

            border: 1px solid #d0d0d0;
            border-radius: 5px;

            background: white;
        }

        .item-card.selected .checkbox {
            background: #222;
            border-color: #222;
        }

        .item-card.selected .checkbox::after {
            content: "✓";

            color: white;

            font-size: 13px;
            font-weight: 600;

            position: absolute;

            left: 4px;
            top: 0px;
        }


        /* =========================
           DELIVERY
        ========================= */

        .delivery-section {
            background: white;

            border: 1px solid #e5e5e5;
            border-radius: 12px;

            padding: 20px;

            margin-bottom: 20px;
        }

        .delivery-section label {
            display: block;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 9px;
        }

        .office-select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d8d8d8;
            border-radius: 8px;

            background: white;

            font-size: 14px;

            outline: none;
        }


        /* =========================
           SUBMIT
        ========================= */

        .submit-btn {
            width: 100%;

            background: #222;
            color: white;

            border: none;

            padding: 15px;

            border-radius: 9px;

            font-size: 15px;
            font-weight: 500;

            cursor: pointer;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }


        /* =========================
           CONFIRMATION
        ========================= */

        .confirmation {
            display: none;

            text-align: center;

            padding: 45px 20px;

            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 12px;
        }

        .confirmation.show {
            display: block;
        }

        .success-icon {
            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: #e8f7ed;
            color: #2e9d55;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 32px;
            font-weight: 600;
        }

        .confirmation h2 {
            font-size: 23px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        .confirmation p {
            color: #777;
            font-size: 14px;
        }

        .order-meta {
            display: flex;
            justify-content: center;
            gap: 30px;

            margin-top: 22px;
        }

        .order-meta span {
            display: block;

            font-size: 12px;
            color: #888;

            margin-bottom: 3px;
        }

        .order-meta strong {
            font-size: 15px;
            font-weight: 600;
        }

        .order-summary {
            margin-top: 22px;

            padding: 16px;

            background: #f7f8fa;

            border-radius: 8px;

            color: #555;

            font-size: 14px;

            line-height: 1.8;

            text-align: left;
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            header {
                padding: 18px 40px;
            }

            main {
                padding-top: 50px;
            }

            .items-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .submit-btn {
                width: auto;
                padding-left: 35px;
                padding-right: 35px;
                float: right;
            }

            .delivery-section {
                clear: both;
            }
        }

    </style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-content">

        <div class="logo">
            Office Refreshments
        </div>

        <div class="category-wrapper">

            <select
                class="category-select"
                id="categorySelect"
            >

                <option value="snacks">
                    🍿 Snacks
                </option>

                <option value="drinks">
                    🥤 Drinks
                </option>

            </select>

        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


    <!-- WELCOME -->

    <div class="welcome">

        <h1>
            Welcome To Primech Cafe!
        </h1>

        <p>
            Choose your refreshments and we'll deliver them to you.
        </p>

    </div>



    <!-- ORDER AREA -->

    <div id="orderArea">


        <!-- CATEGORY TITLE -->

        <div class="category-heading">

            <div
                class="section-title"
                id="sectionTitle"
            >
                Select your snacks
            </div>

            <div
                class="selection-count"
                id="selectionCount"
            >
                0 selected
            </div>

        </div>



        <!-- ITEMS -->

        <div
            class="items-grid"
            id="itemsGrid"
        >
        </div>



        <!-- DELIVERY -->

        <div class="delivery-section">

            <label for="officeSelect">
                Delivery Location
            </label>

            <select
                class="office-select"
                id="officeSelect"
            >

                <option value="">
                    Select an office
                </option>

                <option value="Head Office">
                    Head Office
                </option>

                <option value="Finance Office">
                    Finance Office
                </option>

                <option value="HR Office">
                    HR Office
                </option>

                <option value="Engineering Office">
                    Engineering Office
                </option>

                <option value="Operations Office">
                    Operations Office
                </option>

                <option value="Meeting Room">
                    Meeting Room
                </option>

            </select>

        </div>



        <!-- SUBMIT -->

        <button
            class="submit-btn"
            onclick="submitOrder()"
        >
            Submit Order
        </button>


    </div>



    <!-- =========================
         CONFIRMATION
    ========================= -->

    <div
        class="confirmation"
        id="confirmation"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Order Submitted
        </h2>

        <p>
            Your refreshments request has been successfully submitted.
        </p>

        <div class="order-meta">

            <div>
                <span>Order ID</span>
                <strong id="orderId"></strong>
            </div>

            <div>
                <span>Placed At</span>
                <strong id="orderPlacedAt"></strong>
            </div>

        </div>

        <div
            class="order-summary"
            id="orderSummary"
        >
        </div>

    </div>


</main>



<script>


/* =========================
   MENU
========================= */

    "slots" are the machine slot numbers that
    stock the product (duplicates merged).

    Coffee machine drinks have no slots; their
    images live in Coffee_Machine/.
*/

const DRINK_IMG = "Vending_Machine/Vending_Product_Images/drinks/";

const menu = {

        { name: "Wechips Whole Grain Snacks (21g)", image: SNACK_IMG + "WeChips_Whole_Grain.jpg", slots: [11] },
        { name: "Fitto Onion Rings (15g)", image: SNACK_IMG + "Fitto_Onion_Rings.jpeg", slots: [12] },
        { name: "Pocky Singapore - Strawberry (47g)", image: SNACK_IMG + "Pocky_Strawberry.jpg", slots: [13] },
        { name: "Munch Bite Soft Dried Mango (40g)", image: SNACK_IMG + "Munch_Bite_Dried_Mango.jpeg", slots: [14] },
        { name: "Munch Bite Almonds (40g)", image: SNACK_IMG + "Munch_Bite_Almond.jpeg", slots: [20] },
        { name: "Munch Bite Roasted Salted Cashew (40g)", image: SNACK_IMG + "Munch_Bite_Cashew.jpeg", slots: [21] },
        { name: "Munch Bite Pistachios (40g)", image: SNACK_IMG + "Munch_Bite_Pistachio.jpeg", slots: [22, 48] },
        { name: "Obalab Pure 3 Triangle Cake (100g) - Chocolate", image: SNACK_IMG + "Obalab_Triangle_Cake_Chocolate.jpg", slots: [23] },
        { name: "Tai Sun Peanuts (40g) - Roasted Peanut", image: SNACK_IMG + "Tai_Sun_Roasted_Peanuts.jpg", slots: [24] },
        { name: "Julie's Peanut Sandwich (30g)", image: SNACK_IMG + "Julies_Peanut_Butter_Sandwich.jpg", slots: [30] },
        { name: "Biscuit Packet - Chocolate (35g)", image: SNACK_IMG + "Hello_Panda_Chocolate.jpg", slots: [31] },
        { name: "Lay's Stax (42g) - Sour Cream & Onion", image: SNACK_IMG + "Lays_Stax_Sour_Cream_Onion.jpg", slots: [32] },
        { name: "Lay's Stax (42g) - Seaweed", image: SNACK_IMG + "Lays_Stax_Seaweed.jpg", slots: [33] },
        { name: "Snickers (40g)", image: SNACK_IMG + "Snickers.jpg", slots: [34] },
        { name: "Yan Yan Stick - Chocolate (50g)", image: SNACK_IMG + "Yan_Yan_Chocolate.jpg", slots: [35] },
        { name: "Kit Kat 4F Chocolate (35g)", image: SNACK_IMG + "KitKat_4F_Chocolate.jpg", slots: [36] },
        { name: "M&M Chocolate - Milk (45g)", image: SNACK_IMG + "MnMs_Milk_Chocolate.jpg", slots: [37] },
        { name: "Muffin - Caramel (70g)", image: SNACK_IMG + "Muffin_Caramel.jpg", slots: [38] },
        { name: "Muffin - Double Chocolate (70g)", image: SNACK_IMG + "Muffin_Double_Chocolate.jpg", slots: [39, 60] },
        { name: "Muffin - Milk Chocolate (70g)", image: SNACK_IMG + "Muffin_Milk_Chocolate.jpg", slots: [61] },
        { name: "Muffin - Blueberry (70g)", image: SNACK_IMG + "Muffin_Blueberry.jpg", slots: [62] }
    ],

    drinks: [
        { group: "Coffee Machine", name: "Espresso", image: COFFEE_IMG + "Espresso.svg" },
        { group: "Coffee Machine", name: "Americano", image: COFFEE_IMG + "Americano.svg" },
        { group: "Coffee Machine", name: "Cappuccino", image: COFFEE_IMG + "Cappuccino.svg" },
        { group: "Coffee Machine", name: "Latte", image: COFFEE_IMG + "Latte.svg" },
        { group: "Coffee Machine", name: "Mocha", image: COFFEE_IMG + "Mocha.svg" },
        { group: "Coffee Machine", name: "Hot Chocolate", image: COFFEE_IMG + "Hot_Chocolate.svg" },
        { group: "Coffee Machine", name: "Soya Milk", image: COFFEE_IMG + "Soya_Milk.svg" },
        { group: "Coffee Machine", name: "Soya Latte", image: COFFEE_IMG + "Soya_Latte.svg" },
        { group: "Coffee Machine", name: "Matcha Latte", image: COFFEE_IMG + "Matcha_Latte.svg" },
        { group: "Coffee Machine", name: "Choco Matcha", image: COFFEE_IMG + "Choco_Matcha.svg" },
        { group: "Coffee Machine", name: "Dirty Matcha", image: COFFEE_IMG + "Dirty_Matcha.svg" },
        { group: "Coffee Machine", name: "Mocha Matcha", image: COFFEE_IMG + "Mocha_Matcha.svg" },
        { group: "Coffee Machine", name: "Soya Matcha", image: COFFEE_IMG + "Soya_Matcha.svg" },

        { group: "Vending Machine", name: "Pink Dolphin (250ml) - Peach", image: DRINK_IMG + "Pink_Dolphin_Peach.jpg", slots: [40] },
        { group: "Vending Machine", name: "Tetra Pack - Marigold Lemon Barley (250ml)", image: DRINK_IMG + "Marigold_Lemon_Barley.jpg", slots: [41] },
        { group: "Vending Machine", name: "Tetra Pack - Marigold Lychee (250ml)", image: DRINK_IMG + "Marigold_Lychee.jpg", slots: [42] },
        { group: "Vending Machine", name: "100% Fruit Juice - Tropical Fruits (200ml)", image: DRINK_IMG + "Marigold_100pct_Juice_Tropical.jpg", slots: [43, 44] },
        { group: "Vending Machine", name: "Marigold UHT Full Cream Milk (200ml)", image: DRINK_IMG + "Marigold_UHT_Full_Cream_Milk.jpg", slots: [45, 46, 47] },
        { group: "Vending Machine", name: "Justea White Grape Green Tea (250ml)", image: DRINK_IMG + "Justea_White_Grape_Green_Tea.jpg", slots: [50, 51] },
        { group: "Vending Machine", name: "Yeos Tetra Pack (250ml) - Soy Bean Milk", image: DRINK_IMG + "Yeos_Soy_Bean_Milk.jpg", slots: [52, 53] },
        { group: "Vending Machine", name: "Season Ice Lemon Tea (250ml)", image: DRINK_IMG + "Seasons_Ice_Lemon_Tea.jpg", slots: [54, 55] },
        { group: "Vending Machine", name: "Milo Tetra Pack (200ml)", image: DRINK_IMG + "Milo_Tetra_Pack.jpg", slots: [56, 57, 58, 59] },
        { group: "Vending Machine", name: "Pokka Peach Oolong Drink (250ml)", image: DRINK_IMG + "Pokka_Peach_Oolong.jpg", slots: [63] },
        { group: "Vending Machine", name: "Pokka Jasmine Green Tea (250ml)", image: DRINK_IMG + "Pokka_Jasmine_Green_Tea.jpg", slots: [64, 65, 66] },
        { group: "Vending Machine", name: "Pokka Oolong Tea (250ml)", image: DRINK_IMG + "Pokka_Oolong_Tea.jpg", slots: [67, 68, 69] }
    ]

};



/* =========================
   ORDER SERVER
========================= */

/*
    server.py serves this page at /food/,
    so this resolves to /food/orders.
*/

const ORDERS_URL = "orders";



/* =========================
   IMPORTANT:
   ONE SHARED ORDER
========================= */

let selectedItems = [];



/* =========================
   ELEMENTS
========================= */

const categorySelect =
    document.getElementById("categorySelect");

const itemsGrid =
    document.getElementById("itemsGrid");

const sectionTitle =
    document.getElementById("sectionTitle");

const selectionCount =
    document.getElementById("selectionCount");



/* =========================
   LOAD ITEMS
========================= */

function loadItems(category) {

    itemsGrid.innerHTML = "";


    sectionTitle.textContent =
        category === "snacks"
            ? "Select your snacks"
            : "Select your drinks";


    let currentGroup = null;


    menu[category].forEach(item => {


        /* Sub-heading whenever the group changes */

        if (
            item.group &&
            item.group !== currentGroup
        ) {

            const heading =
                document.createElement("div");

            heading.className = "group-title";
            heading.textContent = item.group;

            itemsGrid.appendChild(heading);

            currentGroup = item.group;

        }


        const card =
            document.createElement("div");


        card.className =
            "item-card";


        /*
            Check whether this item
            was already selected.

            This is what allows snacks
            and drinks to stay selected
            when switching categories.
        */

        if (
            selectedItems.some(
                selected =>
                    selected.name === item.name
            )
        ) {

            card.classList.add("selected");

        }


        card.innerHTML = `

            <div class="checkbox"></div>

            <img
                class="item-image"
                src="${item.image}"
                alt="${item.name}"
                loading="lazy"
            >

            <div class="item-name">
                ${item.name}
            </div>

        `;


        /* CLICK ITEM */

        card.addEventListener(
            "click",
            function () {


                const existingIndex =
                    selectedItems.findIndex(
                        selected =>
                            selected.name === item.name
                    );


                /*
                    If already selected,
                    remove it.
                */

                if (existingIndex !== -1) {

                    selectedItems.splice(
                        existingIndex,
                        1
                    );

                    card.classList.remove(
                        "selected"
                    );

                }


                /*
                    Otherwise add it.
                */

                else {

                    selectedItems.push({
                        name: item.name,
                        category: category
                    });

                    card.classList.add(
                        "selected"
                    );

                }


                updateSelectionCount();

            }
        );


        itemsGrid.appendChild(card);

    });


    updateSelectionCount();

}



/* =========================
   SELECTION COUNT
========================= */

function updateSelectionCount() {

    const count =
        selectedItems.length;


    selectionCount.textContent =
        count === 1
            ? "1 selected"
            : `${count} selected`;

}



/* =========================
   CATEGORY CHANGE
========================= */

categorySelect.addEventListener(
    "change",
    function () {

        loadItems(this.value);

    }
);



/* =========================
   SUBMIT
========================= */

function submitOrder() {


    const office =
        document.getElementById(
            "officeSelect"
        ).value;


    /* No items */

    if (
        selectedItems.length === 0
    ) {

        alert(
            "Please select at least one item."
        );

        return;

    }


    /* No location */

    if (
        office === ""
    ) {

        alert(
            "Please select a delivery location."
        );

        return;

    }


    /*
        Separate snacks and drinks
        for a cleaner confirmation.
    */

    const snacks =
        selectedItems
            .filter(
                item =>
                    item.category === "snacks"
            )
            .map(
                item =>
                    item.name
            );


    const drinks =
        selectedItems
            .filter(
                item =>
                    item.category === "drinks"
            )
            .map(
                item =>
                    item.name
            );


    let summary = "";


    if (snacks.length > 0) {

        summary += `
            <strong>Snacks:</strong>
            ${snacks.join(", ")}
            <br>
        `;

    }


    if (drinks.length > 0) {

        summary += `
            <strong>Drinks:</strong>
            ${drinks.join(", ")}
            <br>
        `;

    }


    summary += `
        <strong>Delivery:</strong>
        ${office}
    `;


    /*
        Send the order to server.py,
        which queues it for the ThingsBoard
        queue widget and gives back its
        order ID and placed time.
    */

    const submitBtn =
        document.querySelector(".submit-btn");

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";


    fetch(ORDERS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ snacks, drinks, office })
    })
        .then(res => {

            if (!res.ok) {
                throw new Error("Server returned " + res.status);
            }

            return res.json();

        })
        .then(order => {

            showConfirmation(order, summary);

        })
        .catch(() => {

            alert(
                "Sorry, your order could not be sent. " +
                "Please check you are on the office Wi-Fi and try again."
            );

            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Order";

        });

}



/* =========================
   CONFIRMATION
========================= */

function showConfirmation(order, summary) {


    document.getElementById(
        "orderId"
    ).textContent = order.id;


    document.getElementById(
        "orderPlacedAt"
    ).textContent =
        new Date(order.placed_at).toLocaleString("en-SG", {
            day: "numeric",
            month: "short",
            hour: "numeric",
            minute: "2-digit"
        });


    /* Hide order */

    document.getElementById(
        "orderArea"
    ).style.display = "none";


    /* Show confirmation */

    const confirmation =
        document.getElementById(
            "confirmation"
        );


    confirmation.classList.add(
        "show"
    );


    /* Insert summary */

    document.getElementById(
        "orderSummary"
    ).innerHTML = summary;

}



/* =========================
   INITIAL LOAD
========================= */

loadItems("snacks");

</script>

</body>
</html>
